syntax = "proto3";

package todo;

import "google/protobuf/empty.proto";

message Todo {
  string id = 1;
  string title = 2;
  bool done = 3;
}

message TodoId {
  string id = 1;
}

message TodoList {
  repeated Todo todos = 1;
}

service TodoService {
  rpc Create(Todo) returns (Todo);
  rpc Read(TodoId) returns (Todo);
  rpc List(google.protobuf.Empty) returns (TodoList);
  rpc Update(Todo) returns (Todo);
  rpc Delete(TodoId) returns (google.protobuf.Empty);
}
